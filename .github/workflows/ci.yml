name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Test
        run: npm test

      - name: Check generated files
        run: |
          node src/generate/brew-mirror.js --check
          node src/generate/github-accel.js --check
